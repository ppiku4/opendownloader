workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages: [release]

windows_release:
  stage: release
  tags: [saas-windows-medium-amd64]
  timeout: 2h
  variables:
    PYTHONUTF8: "1"
    QT_QPA_PLATFORM: offscreen
  script:
    - '& ./packaging/gitlab-release.ps1'
  artifacts:
    name: OpenDownloader-$CI_COMMIT_REF_SLUG
    paths: [release/]
    expire_in: 30 days
